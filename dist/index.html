<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Small Wonders | A place for the things you almost missed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /*
     * THESIS:    A personal field-observation archive built like an architectural & botanical specimen ledger / refuses generic SaaS bento-box marketing and noisy social-feed chrome.
     * MODE:      Hybrid — Persuade (Landing Page: asymmetric left-aligned editorial split hero + live HTML specimen ledger + interactive 3D cartographic relief) | Operate (Notebook, Archive, Editor, Settings: high data-ink ratio, hairline borders, tabular numerals) | Read (About & Legal: 65ch typographic column without card clutter).
     * OWN-WORLD: Warm carbon-peat & cotton-rag paper neutrals (#0C0B0A / #F7F4EE), specimen index numbers (tabular-nums), hairline rules (no border+shadow doubling), concentric radii (12px outer / 8px inner), and terracotta-vermilion (#E04F26 / #C83E14) survey accents.
     * TOKENS:    6 base semantic colors per theme, 3 type roles (Playfair Display editorial headings, Inter UI/prose at 65ch, JetBrains Mono tabular metadata), 4/8px spacing scale, border-only surface elevation (shadow reserved for floating header pill & dialogs), 80-160ms cubic-bezier(0.23, 1, 0.32, 1) interaction budget.
     */
    :root {
      /* Dark Mode: Warm Carbon-Peat & Terracotta-Vermilion (tinted neutrals, no raw #000 or cool slate grey) */
      --bg: #0c0b0a;
      --accent: #e04f26;
      --accent-hover: #eb5e36;
      --card: #151311;

      --canvas: #0c0b0a;
      --surface-1: #151311;
      --surface-2: #1d1a17;
      --surface-hover: #1b1815;
      --text: #f3efe8;
      --text-blush: #f3efe8;
      --text-muted: #a39b90;
      --accent-a: #e04f26;
      --accent-b: #f3efe8;
      --danger: #e5484d;
      --danger-surface: rgba(229, 72, 77, 0.12);
      --focus: #e04f26;
      --line: rgba(243, 239, 232, 0.1);
      --line-strong: rgba(243, 239, 232, 0.2);

      /* Theme-aware component tokens */
      --cta-bg: #f3efe8;
      --cta-text: #0c0b0a;
      --cta-bg-hover: #ffffff;
      --btn-sec-bg: rgba(243, 239, 232, 0.04);
      --btn-sec-bg-hover: rgba(243, 239, 232, 0.09);
      --pill-subtle-bg: rgba(243, 239, 232, 0.04);
      --pill-subtle-bg-hover: rgba(243, 239, 232, 0.08);
      --dot-grid-color: rgba(243, 239, 232, 0.08);

      /* Floating Island Pill Header tokens */
      --header-pill-bg: rgba(18, 16, 14, 0.78);
      --header-pill-border: rgba(243, 239, 232, 0.14);
      --header-pill-shadow: 0 14px 32px -12px rgba(0, 0, 0, 0.65);

      /* 3D Observatory surface tokens */
      --topo-canvas-bg: radial-gradient(circle at 50% 38%, rgba(224, 79, 38, 0.1), rgba(14, 13, 11, 0.96) 74%);
      --topo-hud-bg: rgba(18, 16, 14, 0.82);
      --topo-stroke-subtle: rgba(243, 239, 232, 0.14);
      --topo-fill-1: #11100e;
      --topo-fill-2: #171512;
      --topo-fill-3: #1f1c18;
      --topo-fill-4: #28241f;

      --font-display: 'Playfair Display', Georgia, serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --step--1: clamp(0.8rem, 0.78rem + 0.1vw, 0.875rem);
      --step-0: clamp(0.98rem, 0.95rem + 0.15vw, 1.0625rem);
      --step-1: clamp(1.125rem, 1.06rem + 0.3vw, 1.28rem);
      --step-2: clamp(1.35rem, 1.22rem + 0.65vw, 1.75rem);
      --step-3: clamp(1.75rem, 1.5rem + 1.1vw, 2.35rem);
      --step-4: clamp(2.15rem, 1.75rem + 1.8vw, 3.1rem);
      --step-6: clamp(2.5rem, 2rem + 2.6vw, 3.85rem);

      /* 4/8px Spacing Scale */
      --space-1: 0.5rem;
      --space-2: 1rem;
      --space-3: 1.5rem;
      --space-4: 2rem;
      --space-5: 3rem;
      --space-6: 5rem;

      /* Concentric Radii (outer 12px, inner 8px, pill 9999px) */
      --radius-sm: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-pill: 9999px;

      /* Shadow reserved strictly for floating overlays */
      --shadow-overlay: 0 20px 44px -16px rgba(0, 0, 0, 0.65);

      /* Timing & Easing Budget (interaction-and-motion.md) */
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --dur-press: 80ms;
      --dur-hover: 140ms;
      --dur-header: 360ms;
    }

    [data-theme="light"] {
      /* Archival Warm Cotton-Rag Paper Edition */
      --bg: #f7f4ee;
      --accent: #c83e14;
      --accent-hover: #b0340e;
      --card: #ffffff;

      --canvas: #f7f4ee;
      --surface-1: #ffffff;
      --surface-2: #efece4;
      --surface-hover: #faf8f3;
      --text: #181614;
      --text-blush: #181614;
      --text-muted: #635c53;
      --accent-a: #c83e14;
      --accent-b: #181614;
      --danger: #c81e1e;
      --danger-surface: rgba(200, 30, 30, 0.08);
      --focus: #c83e14;
      --line: rgba(24, 22, 20, 0.11);
      --line-strong: rgba(24, 22, 20, 0.22);

      --cta-bg: #181614;
      --cta-text: #faf8f5;
      --cta-bg-hover: #2c2824;
      --btn-sec-bg: rgba(24, 22, 20, 0.04);
      --btn-sec-bg-hover: rgba(24, 22, 20, 0.08);
      --pill-subtle-bg: rgba(24, 22, 20, 0.045);
      --pill-subtle-bg-hover: rgba(24, 22, 20, 0.085);
      --dot-grid-color: rgba(24, 22, 20, 0.1);

      --header-pill-bg: rgba(247, 244, 238, 0.86);
      --header-pill-border: rgba(24, 22, 20, 0.13);
      --header-pill-shadow: 0 12px 28px -10px rgba(24, 22, 20, 0.1);

      --topo-canvas-bg: radial-gradient(circle at 50% 36%, rgba(200, 62, 20, 0.08), rgba(239, 236, 228, 0.96) 76%);
      --topo-hud-bg: rgba(255, 255, 255, 0.88);
      --topo-stroke-subtle: rgba(24, 22, 20, 0.14);
      --topo-fill-1: #e4ded3;
      --topo-fill-2: #ece7dd;
      --topo-fill-3: #f4f0e8;
      --topo-fill-4: #ffffff;

      --shadow-overlay: 0 18px 38px -14px rgba(24, 22, 20, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    ::selection {
      background-color: var(--accent);
      color: #ffffff;
    }

    html {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
      overflow-x: clip;
      max-width: 100vw;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      overflow-x: clip !important;
      max-width: 100vw !important;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, .font-serif, .font-display, .font-editorial {
      font-family: var(--font-serif);
      font-weight: 500;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.12;
      margin-top: 0;
    }

    p {
      max-width: 68ch;
    }

    .hero-glow-title {
      font-family: var(--font-serif);
      font-size: var(--step-6);
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .hero-glow-subtitle {
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.65;
      max-width: 58ch;
    }

    .hero-backdrop-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.42;
      mix-blend-mode: screen;
      transition: opacity var(--dur-header) var(--ease-out), filter var(--dur-header) var(--ease-out);
    }

    [data-theme="light"] .hero-backdrop-img {
      opacity: 0.18;
      mix-blend-mode: multiply;
      filter: invert(1) hue-rotate(180deg) saturate(1.1) contrast(1.04);
    }

    .hero-backdrop-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 72% 42%, rgba(224, 79, 38, 0.08), transparent 55%),
        linear-gradient(to bottom, rgba(12, 11, 10, 0.35) 0%, var(--bg) 100%);
    }

    [data-theme="light"] .hero-backdrop-gradient {
      background:
        radial-gradient(circle at 72% 42%, rgba(200, 62, 20, 0.07), transparent 55%),
        linear-gradient(to bottom, rgba(247, 244, 238, 0.25) 0%, rgba(247, 244, 238, 0.78) 70%, var(--bg) 100%);
    }

    .heading-section {
      font-family: var(--font-serif);
      font-size: var(--step-4);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }

    .heading-card {
      font-family: var(--font-serif);
      font-size: var(--step-2);
      line-height: 1.18;
      letter-spacing: -0.015em;
    }

    .font-mono-meta,
    .tabular-nums {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .dot-grid-bg {
      background-image: radial-gradient(circle, var(--dot-grid-color) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .skip-link {
      position: absolute;
      top: -100px;
      left: var(--space-2);
      z-index: 100;
      background: var(--accent);
      color: #ffffff;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
    }

    .skip-link:focus {
      top: var(--space-2);
    }

    a, button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }

    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .editorial-container, .premium-container {
      width: 100%;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1.5rem;
      padding-right: 1.5rem;
    }

    .section-band {
      padding-top: var(--space-6);
      padding-bottom: var(--space-6);
      position: relative;
    }

    /* Full-Width Borderless Transparent Header -> Centered Floating Island Pill on Scroll */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      pointer-events: none;
      padding: 0 1rem;
    }

    .header-island {
      pointer-events: auto;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      margin-top: 0px;
      padding: 1.25rem 0.5rem;
      background-color: transparent;
      border: 1px solid transparent;
      border-radius: 0px;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      transition:
        max-width var(--dur-header) var(--ease-out),
        margin-top var(--dur-header) var(--ease-out),
        padding var(--dur-header) var(--ease-out),
        background-color 240ms var(--ease-out),
        border-color 240ms var(--ease-out),
        border-radius var(--dur-header) var(--ease-out),
        box-shadow 240ms var(--ease-out),
        backdrop-filter 240ms var(--ease-out);
    }

    .site-header.is-scrolled .header-island {
      max-width: 880px;
      margin-top: 0.75rem;
      padding: 0.55rem 1.25rem;
      background-color: var(--header-pill-bg);
      border-color: var(--header-pill-border);
      border-radius: var(--radius-pill);
      backdrop-filter: blur(16px) saturate(135%);
      -webkit-backdrop-filter: blur(16px) saturate(135%);
      box-shadow: var(--header-pill-shadow);
    }


    .header-island .btn {
      border-radius: var(--radius-pill);
    }

    .hero-section {
      position: relative;
      min-height: 90dvh;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 7.5rem 0 5rem;
      border-bottom: 1px solid var(--line);
    }

    @media (max-width: 767px) {
      .header-island {
        padding: 0.85rem 0.25rem;
        gap: 0.6rem;
      }
      .nav-links {
        gap: 0.85rem;
      }
      .nav-hide-mobile {
        display: none;
      }
      .hero-section {
        padding: 8.75rem 0 3.5rem;
        min-height: auto;
      }
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .nav-link {
      position: relative;
      text-decoration: none;
      font-size: 0.875rem;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.25rem 0;
      transition: color var(--dur-hover) var(--ease-out);
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background-color: currentColor;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform var(--dur-hover) var(--ease-out);
    }

    @media (hover: hover) {
      .nav-link:hover {
        color: var(--text);
      }

      .nav-link:hover::after {
        transform: scaleX(1);
      }
    }

    .nav-link[aria-current="page"] {
      color: var(--text);
      font-weight: 500;
    }

    .nav-link[aria-current="page"]::after {
      background-color: var(--accent);
      height: 1.5px;
      transform: scaleX(1);
    }

    /* Bounded Surfaces: Border-Only Elevation (SKILL.md §3: "Elevation uses a border or a shadow, not both") */
    .glass, .paper-surface, .spot {
      position: relative;
      background-color: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
    }

    .interactive-card,
    .specimen-quote-card {
      position: relative;
      background-color: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition:
        transform var(--dur-press) var(--ease-out),
        background-color var(--dur-hover) var(--ease-out),
        border-color var(--dur-hover) var(--ease-out);
    }

    .specimen-quote-card:active:not(:disabled) {
      transform: scale(0.99);
    }

    .specimen-quote-card[aria-pressed="true"],
    .specimen-quote-card.is-selected {
      background-color: var(--surface-hover);
      border-color: var(--line-strong);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .interactive-card .card-action-cue,
    .specimen-quote-card .card-action-cue {
      display: inline-block;
      transition: transform var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out);
    }

    @media (hover: hover) {
      .interactive-card:hover,
      .specimen-quote-card:hover {
        background-color: var(--surface-hover);
        border-color: var(--line-strong);
      }

      .interactive-card:hover .card-action-cue,
      .specimen-quote-card:hover .card-action-cue {
        transform: translateX(3px);
        color: var(--text);
      }
    }

    /* Buttons (interaction-and-motion.md: 140ms fill shift, 80ms scale(0.97) active press, @media (hover: hover)) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: var(--radius-sm);
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      padding: 0.68rem 1.25rem;
      font-size: 0.875rem;
      line-height: 1.2;
      border: 1px solid transparent;
      text-decoration: none;
      transition:
        transform var(--dur-press) var(--ease-out),
        background-color var(--dur-hover) var(--ease-out),
        border-color var(--dur-hover) var(--ease-out),
        color var(--dur-hover) var(--ease-out);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .btn:disabled,
    .btn[aria-busy="true"] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-sm {
      padding: 0.45rem 0.9rem;
      font-size: 0.8125rem;
    }

    .btn-lg {
      padding: 0.8rem 1.5rem;
      font-size: 0.9375rem;
    }

    .btn-primary {
      background-color: var(--cta-bg);
      color: var(--cta-text);
      border-color: var(--cta-bg);
    }

    .btn-secondary {
      background-color: var(--btn-sec-bg);
      color: var(--text);
      border-color: var(--line);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border-color: transparent;
    }

    .btn-danger {
      background-color: var(--danger-surface);
      color: var(--danger);
      border-color: rgba(229, 72, 77, 0.32);
    }

    @media (hover: hover) {
      .btn-primary:hover:not(:disabled) {
        background-color: var(--cta-bg-hover);
        border-color: var(--cta-bg-hover);
      }

      .btn-secondary:hover:not(:disabled) {
        background-color: var(--btn-sec-bg-hover);
        border-color: var(--line-strong);
      }

      .btn-ghost:hover:not(:disabled) {
        color: var(--text);
        background-color: var(--pill-subtle-bg);
      }

      .btn-danger:hover:not(:disabled) {
        background-color: var(--danger);
        color: #ffffff;
        border-color: var(--danger);
      }
    }

    .lens-pill {
      padding: 0.32rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      background-color: var(--pill-subtle-bg);
      color: var(--text-muted);
      border: 1px solid var(--line);
      font-weight: 500;
      white-space: nowrap;
      transition:
        transform var(--dur-press) var(--ease-out),
        background-color var(--dur-hover) var(--ease-out),
        color var(--dur-hover) var(--ease-out),
        border-color var(--dur-hover) var(--ease-out);
    }

    .lens-pill:active:not(:disabled) {
      transform: scale(0.97);
    }

    @media (hover: hover) {
      .lens-pill:hover:not([aria-pressed="true"]) {
        background-color: var(--pill-subtle-bg-hover);
        color: var(--text);
        border-color: var(--line-strong);
      }
    }

    .lens-pill[aria-pressed="true"] {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 600;
    }

    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
      align-items: start;
    }

    @media (min-width: 860px) {
      .two-col-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
    }

    .split-7-5-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-4);
      align-items: center;
    }

    @media (min-width: 900px) {
      .split-7-5-grid {
        grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
      }
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.65rem;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--text);
      background: rgba(224, 79, 38, 0.14);
      border: 1px solid rgba(224, 79, 38, 0.38);
      border-radius: var(--radius-sm);
    }

    .index-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      border: 1px solid var(--line);
      color: var(--text-muted);
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.65rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background-color: var(--pill-subtle-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      transition: border-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out);
    }

    @media (hover: hover) {
      button.tag-pill:hover,
      a.tag-pill:hover {
        border-color: var(--line-strong);
        color: var(--text);
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .field-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .field-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
    }

    .field-input, .field-textarea, .field-select {
      width: 100%;
      padding: 0.75rem 0.95rem;
      font-size: 0.95rem;
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      transition: border-color var(--dur-hover) var(--ease-out);
    }

    @media (hover: hover) {
      .field-input:hover:not(:focus),
      .field-textarea:hover:not(:focus),
      .field-select:hover:not(:focus) {
        border-color: var(--text-muted);
      }
    }

    .field-input:focus, .field-textarea:focus, .field-select:focus {
      border-color: var(--accent);
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }

    .field-textarea {
      min-height: 140px;
      line-height: 1.6;
      resize: vertical;
    }

    .field-error {
      font-size: 0.82rem;
      color: var(--danger);
      font-weight: 500;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background-color: rgba(12, 11, 10, 0.76);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      padding: 2rem;
      box-shadow: var(--shadow-overlay);
    }

    .toast-region {
      pointer-events: none;
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      z-index: 70;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 380px;
    }

    .toast-card {
      pointer-events: auto;
      padding: 0.8rem 1.15rem;
      color: var(--text);
      font-size: 0.875rem;
      border-color: var(--accent);
      box-shadow: var(--shadow-overlay);
    }

    .toast-card.error {
      color: var(--danger);
      border-color: var(--danger);
    }

    .seven-day-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.45rem;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

      const rawTags = Array.isArray(payload.tags) ? payload.tags : [];
      if (rawTags.length > MAX_TAGS_COUNT) {
        errors.tags = 'Maximum 5 tags per observation.';
      }
      const normalizedTags = [];
      for (const t of rawTags) {
        const clean = normalizeSingleTag(t);
        if (!clean) continue;
        if (clean.length > MAX_TAG_LENGTH) {
          errors.tags = 'Each tag must be 24 characters or fewer.';
        } else if (!/^[a-z0-9][a-z0-9 -]*$/i.test(clean)) {
          errors.tags = 'Tags may only contain letters, numbers, spaces, and hyphens.';
        } else if (!normalizedTags.includes(clean)) {
          normalizedTags.push(clean);
        }
      }

      const observedMs = Date.parse(payload.observedAt);
      const minMs = Date.UTC(1970, 0, 1);
      const maxMs = Date.now() + 24 * 3600 * 1000;
      if (Number.isNaN(observedMs) || observedMs < minMs || observedMs > maxMs) {
        errors.observedAt = 'Observation date must be a valid timestamp between 1970 and today.';
      }

      const placeLabelRaw = payload.placeLabel ? String(payload.placeLabel).trim().replace(/\s+/g, ' ') : '';
      if (placeLabelRaw.length > MAX_PLACE_LABEL_LENGTH) {
        errors.placeLabel = 'Place label must be 80 characters or fewer.';
      }

      return {
        valid: Object.keys(errors).length === 0,
        errors,
        data: {
          title,
          note,
          category,
          tags: normalizedTags,
          observedAt: Number.isNaN(observedMs) ? new Date().toISOString() : new Date(observedMs).toISOString(),
          placeLabel: placeLabelRaw || null
        }
      };
    }

      const els = document.querySelectorAll('.reveal');
      if (typeof IntersectionObserver === 'undefined') {

        return;

      const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {

          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
      els.forEach(el => {
        el.classList.add('active');

    function sampleObservatoryElevation(x, z, specimen) {
      const r = Math.sqrt(x * x + z * z);
      const falloff = Math.max(0, 1 - Math.pow(r / 1.95, 2));
      if (specimen === 'Light') {
        const ridge = 0.38 * Math.cos(x * 1.65 - 0.35) * Math.cos(z * 1.35) +
                      0.18 * Math.sin(x * 3.1 + z * 2.2) +
                      0.14 * Math.cos(r * 4.2);
        return ridge * falloff - 0.22;
      }
      if (specimen === 'Nature') {
        const cleft = 0.42 * Math.sin(x * 1.9) * Math.cos(z * 1.7) +
                      0.22 * Math.cos((x - z) * 2.8) +
                      0.12 * Math.sin(r * 5.0);
        return cleft * falloff - 0.22;
      }
      const wave = 0.36 * Math.cos(r * 5.2 - 0.4) +
                   0.16 * Math.sin(x * 2.4) * Math.sin(z * 2.4);
      return wave * falloff - 0.22;
    }

    function initNativeCanvas3DObservatory(mount, specimen, isLightTheme, reducedMotion) {
      const width = mount.clientWidth || 580;
      const height = 350;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const canvas = document.createElement('canvas');
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      mount.innerHTML = '';
      mount.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      let pointerX = 0;
      let pointerY = 0;
      const onPointerMove = (e) => {
        if (reducedMotion) return;
        const rect = mount.getBoundingClientRect();
        pointerX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
        pointerY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
      };
      const onPointerLeave = () => { pointerX = 0; pointerY = 0; };
      mount.addEventListener('pointermove', onPointerMove);
      mount.addEventListener('pointerleave', onPointerLeave);

      let rotY = (state.sunAngle - 0.5) * 0.85 - 0.32;
      let rotX = 0.48;
      let startClock = performance.now();
      let rafId = null;

      function project3D(x, y, z, rX, rY) {
        // Rotate around Y
        const cosY = Math.cos(rY), sinY = Math.sin(rY);
        const x1 = x * cosY - z * sinY;
        const z1 = x * sinY + z * cosY;
        // Rotate around X
        const cosX = Math.cos(rX), sinX = Math.sin(rX);
        const y2 = y * cosX - z1 * sinX;
        const z2 = y * sinX + z1 * cosX;
        const fov = 420;
        const dist = 3.55;
        const scale = fov / (dist + z2);
        return {
          sx: width * 0.5 + x1 * scale,
          sy: height * 0.54 - y2 * scale,
          z: z2,
          scale
        };
      }

      function drawScene(now) {
        const elapsed = reducedMotion ? 0 : (now - startClock) * 0.001;
        const targetY = (state.sunAngle - 0.5) * 0.95 - 0.28 + pointerX * 0.45 + Math.sin(elapsed * 0.35) * 0.06;
        const targetX = 0.46 + pointerY * 0.22 + Math.cos(elapsed * 0.28) * 0.02;
        rotY += (targetY - rotY) * 0.1;
        rotX += (targetX - rotX) * 0.1;

        ctx.clearRect(0, 0, width, height);

        const accentStroke = isLightTheme ? '#c83e14' : '#e04f26';
        const accentGlow = isLightTheme ? 'rgba(200, 62, 20, 0.22)' : 'rgba(224, 79, 38, 0.28)';
        const gridStroke = isLightTheme ? 'rgba(24, 22, 20, 0.15)' : 'rgba(243, 239, 232, 0.13)';
        const ridgeStroke = isLightTheme ? 'rgba(200, 62, 20, 0.48)' : 'rgba(224, 79, 38, 0.52)';
        const gimbalStroke = isLightTheme ? 'rgba(24, 22, 20, 0.24)' : 'rgba(243, 239, 232, 0.24)';

        // 1. Astrolabe Meridian & Azimuth Gimbal Rings in 3D
        ctx.lineWidth = 1;
        ctx.strokeStyle = gimbalStroke;
        for (let ringIdx = 0; ringIdx < 2; ringIdx++) {
          ctx.beginPath();
          const segs = 72;
          for (let i = 0; i <= segs; i++) {
            const a = (i / segs) * Math.PI * 2;
            const r = ringIdx === 0 ? 1.52 : 1.32;
            const gx = Math.cos(a) * r;
            const gy = ringIdx === 0 ? Math.sin(a) * r * 0.55 + 0.12 : -0.22;
            const gz = ringIdx === 0 ? Math.sin(a) * r * 0.45 : Math.sin(a) * r;
            const p = project3D(gx, gy, gz, rotX, rotY);
            if (i === 0) ctx.moveTo(p.sx, p.sy);
            else ctx.lineTo(p.sx, p.sy);
          }
          ctx.stroke();
        }

        // 2. Sculpted 3D Topographic Mesh Quads (Painter's Algorithm back-to-front)
        const N = 26;
        const span = 2.85;
        const verts = [];
        for (let iz = 0; iz <= N; iz++) {
          const row = [];
          const vz = ((iz / N) - 0.5) * span;
          for (let ix = 0; ix <= N; ix++) {
            const vx = ((ix / N) - 0.5) * span;
            const r = Math.sqrt(vx * vx + vz * vz);
            const vy = sampleObservatoryElevation(vx, vz, specimen);
            const p = project3D(vx, vy, vz, rotX, rotY);
            row.push({ vx, vy, vz, r, ...p });
          }
          verts.push(row);
        }

        const quads = [];
        for (let iz = 0; iz < N; iz++) {
          for (let ix = 0; ix < N; ix++) {
            const v00 = verts[iz][ix];
            const v10 = verts[iz][ix + 1];
            const v11 = verts[iz + 1][ix + 1];
            const v01 = verts[iz + 1][ix];
            if (v00.r > 1.52 && v11.r > 1.52) continue;
            const avgZ = (v00.z + v10.z + v11.z + v01.z) * 0.25;
            const avgY = (v00.vy + v10.vy + v11.vy + v01.vy) * 0.25;
            const slopeX = (v10.vy - v00.vy) * 8;
            quads.push({ v00, v10, v11, v01, avgZ, avgY, slopeX });
          }
        }
        quads.sort((a, b) => b.avgZ - a.avgZ);

        const sunDirX = Math.cos(state.sunAngle * Math.PI);
        for (const q of quads) {
          const elevNorm = Math.max(0, Math.min(1, (q.avgY + 0.24) / 0.55));
          const shade = Math.max(0, Math.min(1, 0.45 + elevNorm * 0.45 + q.slopeX * sunDirX * 0.25));
          if (isLightTheme) {
            const lum = Math.round(224 + shade * 28);
            ctx.fillStyle = `rgb(${lum}, ${lum - 4}, ${lum - 11})`;
          } else {
            const lum = Math.round(16 + shade * 28);
            ctx.fillStyle = `rgb(${lum + 3}, ${lum}, ${lum - 2})`;
          }
          ctx.strokeStyle = elevNorm > 0.52 ? ridgeStroke : gridStroke;
          ctx.lineWidth = elevNorm > 0.52 ? 0.95 : 0.65;
          ctx.beginPath();
          ctx.moveTo(q.v00.sx, q.v00.sy);
          ctx.lineTo(q.v10.sx, q.v10.sy);
          ctx.lineTo(q.v11.sx, q.v11.sy);
          ctx.lineTo(q.v01.sx, q.v01.sy);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        // 3. Precision Iso-Elevation Terrace Rings
        for (let lvl = 1; lvl <= 4; lvl++) {
          const frac = lvl / 5;
          const rad = 1.38 - frac * 0.88;
          const ry = -0.18 + frac * 0.36;
          ctx.beginPath();
          ctx.strokeStyle = lvl === 4 ? accentStroke : ridgeStroke;
          ctx.lineWidth = lvl === 4 ? 1.5 : 1.0;
          for (let i = 0; i <= 64; i++) {
            const a = (i / 64) * Math.PI * 2;
            const px = Math.cos(a) * rad;
            const pz = Math.sin(a) * rad;
            const py = sampleObservatoryElevation(px, pz, specimen) + 0.02 + lvl * 0.015;
            const p = project3D(px, py, pz, rotX, rotY);
            if (i === 0) ctx.moveTo(p.sx, p.sy);
            else ctx.lineTo(p.sx, p.sy);
          }
          ctx.stroke();
        }

        // 4. Specimen Focal 3D Sculpture Above Summit
        const floatY = 0.46 + Math.sin(elapsed * 1.5) * 0.025;
        const centerP = project3D(0, floatY, 0, rotX, rotY);

        // Subtle radial glow behind focal specimen
        const grad = ctx.createRadialGradient(centerP.sx, centerP.sy, 2, centerP.sx, centerP.sy, 46);
        grad.addColorStop(0, accentGlow);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(centerP.sx, centerP.sy, 46, 0, Math.PI * 2);
        ctx.fill();

        if (specimen === 'Light') {
          // 3D Octahedron Prism + Outer Wireframe Cage
          const spin = elapsed * 0.5 + rotY;
          const h = 0.25, r = 0.19;
          const top = project3D(0, floatY + h, 0, rotX, 0);
          const bot = project3D(0, floatY - h, 0, rotX, 0);
          const ringPts = [0, 1, 2, 3].map(i => {
            const a = spin + i * Math.PI * 0.5;
            return project3D(Math.cos(a) * r, floatY, Math.sin(a) * r, rotX, 0);
          });
          ctx.fillStyle = isLightTheme ? 'rgba(255, 248, 240, 0.88)' : 'rgba(243, 239, 232, 0.9)';
          ctx.strokeStyle = accentStroke;
          ctx.lineWidth = 1.4;
          for (let i = 0; i < 4; i++) {
            const p1 = ringPts[i], p2 = ringPts[(i + 1) % 4];
            ctx.beginPath();
            ctx.moveTo(top.sx, top.sy);
            ctx.lineTo(p1.sx, p1.sy);
            ctx.lineTo(p2.sx, p2.sy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(bot.sx, bot.sy);
            ctx.lineTo(p1.sx, p1.sy);
            ctx.lineTo(p2.sx, p2.sy);
            ctx.closePath();
            ctx.stroke();
          }
        } else if (specimen === 'Nature') {
          // 3D Phyllotaxis Botanical Spire
          for (let tier = 0; tier < 6; tier++) {
            const ty = floatY - 0.18 + tier * 0.075;
            const tr = 0.24 - tier * 0.03;
            ctx.beginPath();
            ctx.strokeStyle = accentStroke;
            ctx.fillStyle = isLightTheme ? 'rgba(200, 62, 20, 0.18)' : 'rgba(224, 79, 38, 0.24)';
            ctx.lineWidth = 1.3;
            for (let j = 0; j <= 5; j++) {
              const a = elapsed * 0.35 + tier * 0.8 + (j / 5) * Math.PI * 2;
              const p = project3D(Math.cos(a) * tr, ty + (j % 2) * 0.04, Math.sin(a) * tr, rotX, rotY);
              if (j === 0) ctx.moveTo(p.sx, p.sy);
              else ctx.lineTo(p.sx, p.sy);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        } else {
          // 3D Harmonic Resonator & Concentric Wave Rings
          [0.18, 0.32, 0.48].forEach((rad, idx) => {
            ctx.beginPath();
            ctx.strokeStyle = accentStroke;
            ctx.lineWidth = 1.5 - idx * 0.3;
            for (let i = 0; i <= 48; i++) {
              const a = (i / 48) * Math.PI * 2;
              const p = project3D(
                Math.cos(a) * rad,
                floatY + Math.sin(a + elapsed + idx) * 0.08,
                Math.sin(a) * rad,
                rotX,
                rotY
              );
              if (i === 0) ctx.moveTo(p.sx, p.sy);
              else ctx.lineTo(p.sx, p.sy);
            }
            ctx.stroke();
          });
        }

        // 5. Orbiting Solar Azimuth Node
        const sAngle = state.sunAngle * Math.PI;
        const sunP = project3D(
          Math.cos(sAngle) * 1.42,
          0.18 + Math.sin(sAngle) * 0.38,
          Math.sin(sAngle) * 1.05,
          rotX,
          rotY
        );
        ctx.fillStyle = accentStroke;
        ctx.beginPath();
        ctx.arc(sunP.sx, sunP.sy, 5, 0, Math.PI * 2);
        ctx.fill();

        if (!reducedMotion) {
          rafId = requestAnimationFrame(drawScene);
        }
      }

      drawScene(performance.now());

      activeThreeCleanup = () => {
        if (rafId) cancelAnimationFrame(rafId);
        mount.removeEventListener('pointermove', onPointerMove);
        mount.removeEventListener('pointerleave', onPointerLeave);
      };
    }

    function initHeroThreeScene() {
      destroyActiveThreeScene();
      const mount = document.getElementById('hero-three-mount');
      if (!mount) return;

      const isMobile = window.innerWidth < 768;
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const specimen = state.observatorySpecimen || 'Light';
      const isLightTheme = state.theme === 'light';

      if (isMobile) {
        mount.innerHTML = renderStaticTopographySvg(state.sunAngle, specimen);
        return;
      }

      if (typeof window.THREE === 'undefined') {
        initNativeCanvas3DObservatory(mount, specimen, isLightTheme, reducedMotion);
        return;
      }

      try {
        const THREE = window.THREE;
        const width = mount.clientWidth || 540;
        const height = 350;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 50);
        camera.position.set(0, 1.55, 3.65);
        camera.lookAt(0, 0.05, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
        mount.innerHTML = '';
        mount.appendChild(renderer.domElement);

        const rootGroup = new THREE.Group();
        rootGroup.rotation.set(0.32, -0.28, 0);
        scene.add(rootGroup);

        const accentHex = isLightTheme ? 0xe03c00 : 0xff4500;
        const secondaryHex = isLightTheme ? 0x4a433b : 0xffe0e0;
        const surfaceHex = isLightTheme ? 0xece7dd : 0x121215;
        const wireHex = isLightTheme ? 0x8c8275 : 0xff4500;
        const baseHex = isLightTheme ? 0xdcd5c7 : 0x09090b;

        const ambient = new THREE.AmbientLight(isLightTheme ? 0xfffaf0 : 0xffe0e0, isLightTheme ? 1.15 : 0.68);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(accentHex, isLightTheme ? 1.55 : 2.1);
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(isLightTheme ? 0xffffff : 0xffe0e0, isLightTheme ? 0.85 : 0.55);
        fillLight.position.set(-2.4, 2.8, -1.8);
        scene.add(fillLight);

        const pointLight = new THREE.PointLight(accentHex, 1.7, 3.8);
        pointLight.position.set(0, 0.65, 0);
        rootGroup.add(pointLight);

        // 1. Precision Base Compass Plinth & Graduation Ring
        const plinthGeom = new THREE.CylinderGeometry(1.66, 1.72, 0.08, 64);
        const plinthMat = new THREE.MeshStandardMaterial({ color: baseHex, roughness: 0.65, metalness: 0.25 });
        const plinthMesh = new THREE.Mesh(plinthGeom, plinthMat);
        plinthMesh.position.set(0, -0.34, 0);
        rootGroup.add(plinthMesh);

        const gradGeom = new THREE.RingGeometry(1.56, 1.62, 64);
        const gradMat = new THREE.MeshBasicMaterial({ color: accentHex, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
        const gradMesh = new THREE.Mesh(gradGeom, gradMat);
        gradMesh.position.set(0, -0.29, 0);
        gradMesh.rotation.x = Math.PI / 2;
        rootGroup.add(gradMesh);

        // 2. Sculpted Procedural Topographic Relief Mesh + Wireframe Lattice
        const terrainGeom = new THREE.PlaneGeometry(3.2, 3.2, 52, 52);
        terrainGeom.rotateX(-Math.PI / 2);
        const posAttr = terrainGeom.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
          const vx = posAttr.getX(i);
          const vz = posAttr.getZ(i);
          const vy = sampleObservatoryElevation(vx, vz, specimen);
          posAttr.setY(i, vy);
        }
        terrainGeom.computeVertexNormals();

        const terrainMat = new THREE.MeshStandardMaterial({
          color: surfaceHex,
          roughness: isLightTheme ? 0.58 : 0.42,
          metalness: isLightTheme ? 0.08 : 0.35,
          flatShading: true
        });
        const terrainMesh = new THREE.Mesh(terrainGeom, terrainMat);
        terrainMesh.position.set(0, 0.02, 0);
        rootGroup.add(terrainMesh);

        const wireMat = new THREE.MeshBasicMaterial({
          color: wireHex,
          wireframe: true,
          transparent: true,
          opacity: isLightTheme ? 0.22 : 0.24
        });
        const wireMesh = new THREE.Mesh(terrainGeom, wireMat);
        wireMesh.position.set(0, 0.024, 0);
        rootGroup.add(wireMesh);

        // 3. Stepped Iso-Elevation Contour Rings
        for (let lvl = 0; lvl <= 6; lvl++) {
          const frac = lvl / 6;
          const radius = 1.48 - frac * 1.02;
          const y = -0.24 + frac * 0.48;
          const isMajor = lvl % 2 === 0;
          const cGeom = new THREE.TorusGeometry(radius, isMajor ? 0.009 : 0.005, 12, 72);
          const cMat = new THREE.MeshStandardMaterial({
            color: isMajor ? accentHex : secondaryHex,
            emissive: isMajor ? accentHex : 0x000000,
            emissiveIntensity: isMajor ? 0.45 : 0,
            transparent: true,
            opacity: isMajor ? 0.82 : 0.35
          });
          const cMesh = new THREE.Mesh(cGeom, cMat);
          cMesh.position.set(0, y, 0);
          cMesh.rotation.set(Math.PI / 2, 0, lvl * 0.25);
          rootGroup.add(cMesh);
        }

        // 4. Dual Cartographic Astrolabe Meridian Gimbals
        const gimbalOuterGeom = new THREE.TorusGeometry(1.42, 0.008, 16, 96);
        const gimbalOuterMat = new THREE.MeshStandardMaterial({
          color: secondaryHex,
          roughness: 0.3,
          metalness: 0.6,
          transparent: true,
          opacity: isLightTheme ? 0.45 : 0.32
        });
        const gimbalOuter = new THREE.Mesh(gimbalOuterGeom, gimbalOuterMat);
        gimbalOuter.position.set(0, 0.18, 0);
        gimbalOuter.rotation.set(0.18, 0.4, 0);
        rootGroup.add(gimbalOuter);

        const gimbalInnerGeom = new THREE.TorusGeometry(1.18, 0.01, 16, 96);
        const gimbalInnerMat = new THREE.MeshStandardMaterial({
          color: accentHex,
          emissive: accentHex,
          emissiveIntensity: 0.4,
          roughness: 0.25,
          metalness: 0.5
        });
        const gimbalInner = new THREE.Mesh(gimbalInnerGeom, gimbalInnerMat);
        gimbalInner.position.set(0, 0.18, 0);
        gimbalInner.rotation.set(Math.PI / 2.6, 0, 0);
        rootGroup.add(gimbalInner);

        // Orbiting Solar Node
        const sunNodeGeom = new THREE.SphereGeometry(0.055, 16, 16);
        const sunNodeMat = new THREE.MeshStandardMaterial({
          color: 0xffe0e0,
          emissive: accentHex,
          emissiveIntensity: 1.1
        });
        const sunNode = new THREE.Mesh(sunNodeGeom, sunNodeMat);
        rootGroup.add(sunNode);

        // 5. Specimen-Specific Focal Sculpture
        const focalGroup = new THREE.Group();
        focalGroup.position.set(0, 0.46, 0);
        rootGroup.add(focalGroup);

        if (specimen === 'Light') {
          const coreGeom = new THREE.OctahedronGeometry(0.26, 0);
          const coreMat = new THREE.MeshStandardMaterial({
            color: isLightTheme ? 0xfff5eb : 0xffe0e0,
            emissive: accentHex,
            emissiveIntensity: 0.65,
            roughness: 0.12,
            metalness: 0.35
          });
          focalGroup.add(new THREE.Mesh(coreGeom, coreMat));

          const cageGeom = new THREE.OctahedronGeometry(0.38, 0);
          const cageMat = new THREE.MeshBasicMaterial({ color: accentHex, wireframe: true, transparent: true, opacity: 0.65 });
          const cageMesh = new THREE.Mesh(cageGeom, cageMat);
          cageMesh.rotation.set(0.4, 0.6, 0);
          focalGroup.add(cageMesh);

          const haloGeom = new THREE.TorusGeometry(0.52, 0.008, 12, 64);
          const haloMat = new THREE.MeshBasicMaterial({ color: secondaryHex, transparent: true, opacity: 0.6 });
          const haloMesh = new THREE.Mesh(haloGeom, haloMat);
          haloMesh.rotation.x = Math.PI / 2;
          focalGroup.add(haloMesh);
        } else if (specimen === 'Nature') {
          for (let tier = 0; tier < 6; tier++) {
            const tierScale = 0.28 - tier * 0.035;
            const tierY = -0.18 + tier * 0.09;
            const fGeom = new THREE.ConeGeometry(tierScale, 0.14, 5);
            const fMat = new THREE.MeshStandardMaterial({
              color: tier % 2 === 0 ? accentHex : secondaryHex,
              emissive: accentHex,
              emissiveIntensity: 0.38,
              roughness: 0.28,
              metalness: 0.2,
              flatShading: true
            });
            const fMesh = new THREE.Mesh(fGeom, fMat);
            fMesh.position.set(0, tierY, 0);
            fMesh.rotation.set(0.22, tier * 1.05, 0.18);
            focalGroup.add(fMesh);
          }
        } else {
          const icoGeom = new THREE.IcosahedronGeometry(0.2, 0);
          const icoMat = new THREE.MeshStandardMaterial({
            color: secondaryHex,
            emissive: accentHex,
            emissiveIntensity: 0.75,
            roughness: 0.18,
            metalness: 0.45
          });
          focalGroup.add(new THREE.Mesh(icoGeom, icoMat));

          [0.34, 0.5, 0.68].forEach((rad, i) => {
            const rGeom = new THREE.TorusGeometry(rad, 0.009, 12, 64);
            const rMat = new THREE.MeshStandardMaterial({
              color: accentHex,
              emissive: accentHex,
              emissiveIntensity: 0.55 - i * 0.12
            });
            const rMesh = new THREE.Mesh(rGeom, rMat);
            rMesh.rotation.set(Math.PI / 2 + i * 0.22, i * 0.35, 0);
            focalGroup.add(rMesh);
          });
        }

        // 6. Atmospheric Particle Field
        const pCount = 42;
        const pPositions = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount; i++) {
          const ang = (i / pCount) * Math.PI * 2 * 3.7;
          const rad = 0.25 + ((i * 19) % 100) / 100 * 1.35;
          pPositions[i * 3] = Math.cos(ang) * rad;
          pPositions[i * 3 + 1] = -0.05 + ((i * 31) % 100) / 100 * 0.95;
          pPositions[i * 3 + 2] = Math.sin(ang) * rad;
        }
        const pGeom = new THREE.BufferGeometry();
        pGeom.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        const pMat = new THREE.PointsMaterial({
          size: 0.032,
          color: accentHex,
          transparent: true,
          opacity: isLightTheme ? 0.55 : 0.75
        });
        const points = new THREE.Points(pGeom, pMat);
        rootGroup.add(points);

        let pointerX = 0;
        let pointerY = 0;
        const onPointerMove = (e) => {
          if (reducedMotion) return;
          const rect = mount.getBoundingClientRect();
          pointerX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
          pointerY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
        };
        const onPointerLeave = () => {
          pointerX = 0;
          pointerY = 0;
        };
        mount.addEventListener('pointermove', onPointerMove);
        mount.addEventListener('pointerleave', onPointerLeave);

        function updateSolarPosition() {
          const angle = state.sunAngle * Math.PI;
          dirLight.position.set(Math.cos(angle) * 2.8, 3.25 + Math.sin(angle) * 0.75, Math.sin(angle) * 2.2 + 0.8);
          sunNode.position.set(
            Math.cos(angle) * 1.42,
            0.18 + Math.sin(angle) * 0.42,
            Math.sin(angle) * 1.15
          );
          rootGroup.rotation.y = (state.sunAngle - 0.5) * 0.85;
          renderer.render(scene, camera);
        }

        updateSolarPosition();

        let rafId = null;
        let startClock = performance.now();

        function animate(now) {
          if (reducedMotion) return;
          const elapsed = (now - startClock) * 0.001;
          const targetY = (state.sunAngle - 0.5) * 0.85 + pointerX * 0.42 + Math.sin(elapsed * 0.32) * 0.05;
          const targetX = 0.32 + pointerY * 0.24 + Math.cos(elapsed * 0.26) * 0.02;
          rootGroup.rotation.y += (targetY - rootGroup.rotation.y) * 0.08;
          rootGroup.rotation.x += (targetX - rootGroup.rotation.x) * 0.08;
          focalGroup.position.y = 0.46 + Math.sin(elapsed * 1.4) * 0.03;
          focalGroup.rotation.y = elapsed * 0.45;
          gimbalOuter.rotation.z = Math.sin(elapsed * 0.25) * 0.08;
          gimbalInner.rotation.x = Math.PI / 2.6 + Math.cos(elapsed * 0.3) * 0.06;
          points.rotation.y = elapsed * 0.08;
          renderer.render(scene, camera);
          rafId = requestAnimationFrame(animate);
        }

        if (!reducedMotion) {
          rafId = requestAnimationFrame(animate);
        }

        const onResize = () => {
          if (!mount) return;
          const newW = mount.clientWidth || 540;
          camera.aspect = newW / height;
          camera.updateProjectionMatrix();
          renderer.setSize(newW, height);
          renderer.render(scene, camera);
        };
        window.addEventListener('resize', onResize);

        activeThreeCleanup = () => {
          if (rafId) cancelAnimationFrame(rafId);
          window.removeEventListener('resize', onResize);
          mount.removeEventListener('pointermove', onPointerMove);
          mount.removeEventListener('pointerleave', onPointerLeave);
          renderer.dispose();
        };
      } catch (err) {
        mount.innerHTML = renderStaticTopographySvg(state.sunAngle, specimen);
      }
    }

    function computeInsights(entries) {
      const nowMs = Date.now();
      const sevenDaysAgo = nowMs - 7 * 24 * 3600 * 1000;
      const entriesLastSevenDays = entries.filter(e => Date.parse(e.observedAt) >= sevenDaysAgo).length;

      const catMap = {};
      ENTRY_CATEGORIES.forEach(c => { catMap[c] = 0; });
      const tagMap = {};

      entries.forEach(e => {
        catMap[e.category] = (catMap[e.category] || 0) + 1;
        (e.tags || []).forEach(t => {
          tagMap[t] = (tagMap[t] || 0) + 1;
        });
      });

      const total = entries.length;
      const categoryDistribution = ENTRY_CATEGORIES.map(c => ({
        category: c,
        count: catMap[c] || 0,
        percentage: total > 0 ? Math.round(((catMap[c] || 0) / total) * 100) : 0
      })).sort((a, b) => b.count - a.count);

      const recentTags = Object.entries(tagMap)
        .map(([tag, count]) => ({ tag, count }))
        .sort((a, b) => b.count - a.count)
        .slice(0, 8);

      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const dailyActivity = [];
      for (let offset = 6; offset >= 0; offset--) {
        const d = new Date(nowMs - offset * 24 * 3600 * 1000);
        const dateIso = d.toISOString().slice(0, 10);
        const count = entries.filter(e => String(e.observedAt).slice(0, 10) === dateIso).length;
        dailyActivity.push({ dateIso, dayLabel: dayNames[d.getDay()], count });
      }

      return {
        entriesLastSevenDays,
        totalEntriesInSample: total,
        categoryDistribution,
        recentTags,
        dailyActivity
      };
    }

                  </div>
                  <input id="ed-tag-input" type="text" class="field-input" maxlength="${MAX_TAG_LENGTH}" placeholder="Type a tag and press Add (e.g., winter-light)" value="${escapeHtml(ed.tagDraft)}" />
                </div>
                <button type="button" class="btn btn-secondary" id="ed-add-tag-btn">Add tag</button>
              </div>
              ${ed.errors.tags ? `<span class="field-error" role="alert" style="display: block; margin-top: var(--space-1);">${escapeHtml(ed.errors.tags)}</span>` : ''}
              <div style="display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-2);">
                ${ed.tags.map(t => `
                  <span class="tag-pill">
                    #${escapeHtml(t)}
                    <button type="button" class="ed-remove-tag-btn" data-tag="${escapeHtml(t)}" aria-label="Remove tag ${escapeHtml(t)}" style="background: transparent; border: none; cursor: pointer; font-weight: 700; color: var(--text-muted); padding: 0;">&times;</button>
                  </span>
                `).join('')}
              </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--line);">
              <button type="button" class="btn btn-secondary" id="ed-cancel-btn">Cancel</button>
              <button type="submit" class="btn btn-primary" id="ed-save-btn">
                ${existingEntry ? 'Save changes' : 'Save observation'}
              </button>
            </div>
          </form>
        </div>
      `;

      const titleEl = document.getElementById('ed-title');
      const noteEl = document.getElementById('ed-note');
      const placeEl = document.getElementById('ed-place');
      const obsEl = document.getElementById('ed-observed-at');
      const tagInEl = document.getElementById('ed-tag-input');

      titleEl.addEventListener('input', (e) => {
        ed.title = e.target.value;
        ed.isDirty = true;
        document.getElementById('ed-title-counter').textContent = `${ed.title.length} / ${MAX_TITLE_LENGTH}`;
      });

      noteEl.addEventListener('input', (e) => {
        ed.note = e.target.value;
        ed.isDirty = true;
        document.getElementById('ed-note-counter').textContent = `${ed.note.length} / ${MAX_NOTE_LENGTH}`;
      });

      placeEl.addEventListener('input', (e) => {
        ed.placeLabel = e.target.value;
        ed.isDirty = true;
        document.getElementById('ed-place-counter').textContent = `${ed.placeLabel.length} / ${MAX_PLACE_LABEL_LENGTH}`;
      });

      obsEl.addEventListener('change', (e) => {
        ed.observedAtLocal = e.target.value;
        ed.isDirty = true;
      });

      tagInEl.addEventListener('input', (e) => {
        ed.tagDraft = e.target.value;
      });

      document.querySelectorAll('.ed-cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          ed.category = btn.getAttribute('data-cat');
          ed.isDirty = true;
          renderEditorView(main, existingEntry);
        });
      });

      document.getElementById('ed-add-tag-btn').addEventListener('click', () => {
        const clean = normalizeSingleTag(ed.tagDraft);
        if (!clean) return;
        if (ed.tags.length >= MAX_TAGS_COUNT) {
          ed.errors.tags = 'Maximum 5 tags per observation.';
        } else if (!ed.tags.includes(clean)) {
          ed.tags.push(clean);
          ed.tagDraft = '';
          delete ed.errors.tags;
          ed.isDirty = true;
        }
        renderEditorView(main, existingEntry);
      });

      document.querySelectorAll('.ed-remove-tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const t = btn.getAttribute('data-tag');
          ed.tags = ed.tags.filter(item => item !== t);
          ed.isDirty = true;
          renderEditorView(main, existingEntry);
        });
      });

      document.getElementById('ed-cancel-btn').addEventListener('click', () => {
        const dest = existingEntry ? `/app/journal/${existingEntry.id}` : '/app/journal';
        if (ed.isDirty) {
          openModal({
            title: 'Discard unsaved observation?',
            description: 'You have unsaved notes in the editor. Leaving now will discard these changes.',
            cancelLabel: 'Keep editing',
            confirmLabel: 'Discard changes',
            danger: true,
            onConfirm: () => {
              ed.entryId = '__reset__';
              navigate(dest);
            }
          });
        } else {
          ed.entryId = '__reset__';
          navigate(dest);
        }
      });

      document.getElementById('entry-editor-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const finalTags = [...ed.tags];
        if (ed.tagDraft.trim()) {
          const cleanDraft = normalizeSingleTag(ed.tagDraft);
          if (cleanDraft && !finalTags.includes(cleanDraft) && finalTags.length < MAX_TAGS_COUNT) {
            finalTags.push(cleanDraft);
          }
        }

        const validation = validateEntryPayload({
          title: ed.title,
          note: ed.note,
          category: ed.category,
          tags: finalTags,
          observedAt: ed.observedAtLocal ? new Date(ed.observedAtLocal).toISOString() : new Date().toISOString(),
          placeLabel: ed.placeLabel
        });

        if (!validation.valid) {
          ed.errors = validation.errors;
          renderEditorView(main, existingEntry);
          return;
        }

        const list = getUserEntries(state.user.uid);
        const nowIso = new Date().toISOString();

        if (existingEntry) {
          const idx = list.findIndex(item => item.id === existingEntry.id);
          if (idx !== -1) {
            list[idx] = {
              ...list[idx],
              ...validation.data,
              updatedAt: nowIso
            };
            saveUserEntries(state.user.uid, list);
          }
          ed.entryId = '__reset__';
          showToast('Observation updated.', 'success');
          navigate(`/app/journal/${existingEntry.id}`);
        } else {
          const newId = 'sw_' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
          const created = {
            id: newId,
            ...validation.data,
            createdAt: nowIso,
            updatedAt: nowIso,
            schemaVersion: 1
          };
          saveUserEntries(state.user.uid, [created, ...list]);
          ed.entryId = '__reset__';
          showToast('Observation saved to your journal.', 'success');
          navigate(`/app/journal/${newId}`);
        }
      });
    }

    function renderDetailView(main, entryId, editMode) {
      destroyActiveThreeScene();
      const entries = getUserEntries(state.user.uid);
      const entry = entries.find(e => e.id === entryId);

      if (!entry) {
        main.innerHTML = `
          <div class="editorial-container section-band" style="padding-top: 7.5rem;" style="max-width: 580px; text-align: center;">
            <div class="glass" style="padding: var(--space-4);">
              <h1 class="heading-card" style="margin-bottom: var(--space-1);">Observation not found</h1>
              <p style="color: var(--text-muted); margin-bottom: var(--space-3);">This journal entry could not be found or you do not have permission to read it.</p>
              <a href="#/app/journal" class="btn btn-primary">Return to archive</a>
            </div>
          </div>
        `;
        return;
      }

      if (editMode) {
        renderEditorView(main, entry);
        return;
      }

      main.innerHTML = `
        <div class="editorial-container" style="padding-top: 6rem; padding-bottom: var(--space-6); max-width: 760px;">
          <div style="margin-bottom: var(--space-2);">
            <a href="#/app/journal" style="font-size: var(--step--1); color: var(--text-muted); text-decoration: none;">Back to journal archive</a>
          </div>

          <article class="glass" style="padding: var(--space-4);">
            <header style="padding-bottom: var(--space-3); margin-bottom: var(--space-3); border-bottom: 1px solid var(--line);">
              <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-2);">
                <span class="category-badge">${escapeHtml(entry.category)}</span>
                <span class="font-mono-meta" style="color: var(--text-muted);">
                  Observed ${escapeHtml(formatReadableDate(entry.observedAt))} at ${escapeHtml(formatReadableTime(entry.observedAt))}
                </span>
              </div>
              <h1 class="heading-section" style="font-size: var(--step-3); margin-bottom: var(--space-1);">${escapeHtml(entry.title)}</h1>
              ${entry.placeLabel ? `<p class="font-mono-meta" style="color: var(--accent); margin: 0;">Place: ${escapeHtml(entry.placeLabel)}</p>` : ''}
            </header>

            <div style="font-size: var(--step-1); line-height: 1.75; white-space: pre-wrap; margin-bottom: var(--space-4);">${escapeHtml(entry.note)}</div>

            ${(entry.tags || []).length > 0 ? `
              <div style="display: flex; flex-wrap: wrap; gap: var(--space-1); padding-bottom: var(--space-3); margin-bottom: var(--space-3); border-bottom: 1px solid var(--line);">
                ${entry.tags.map(t => `<span class="tag-pill">#${escapeHtml(t)}</span>`).join('')}
              </div>
            ` : ''}

            <footer style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-2);">
              <span class="font-mono-meta" style="color: var(--text-muted);">Last updated: ${escapeHtml(formatReadableDate(entry.updatedAt))}</span>
              <div style="display: flex; gap: var(--space-1);">
                <button type="button" class="btn btn-secondary btn-sm" id="detail-edit-btn">Edit observation</button>
                <button type="button" class="btn btn-danger btn-sm" id="detail-delete-btn">Delete</button>
              </div>
            </footer>
          </article>
        </div>
      `;

      document.getElementById('detail-edit-btn').addEventListener('click', () => {
        navigate(`/app/journal/${encodeURIComponent(entry.id)}/edit`);
      });

      document.getElementById('detail-delete-btn').addEventListener('click', () => {
        openModal({
          title: 'Delete this observation?',
          description: `"${entry.title}" will be permanently removed from your field journal. This action cannot be undone.`,
          cancelLabel: 'Cancel',
          confirmLabel: 'Permanently delete',
          danger: true,
          onConfirm: () => {
            const nextList = entries.filter(item => item.id !== entry.id);
            saveUserEntries(state.user.uid, nextList);
            showToast('Observation removed from your journal.');
            navigate('/app/journal');
          }
        });
      });
    }

    function renderSettingsView(main) {
      destroyActiveThreeScene();
      const entries = getUserEntries(state.user.uid);

      main.innerHTML = `
        <div class="editorial-container" style="padding-top: 6rem; padding-bottom: var(--space-6); max-width: 760px; display: flex; flex-direction: column; gap: var(--space-3);">
          <header style="padding-bottom: var(--space-2); border-bottom: 1px solid var(--line);">
            <p class="font-mono-meta" style="color: var(--accent); margin: 0 0 var(--space-1) 0;">ACCOUNT &amp; PRIVACY</p>
            <h1 class="heading-section" style="margin: 0;">Journal settings</h1>
          </header>

          <section class="paper-surface" style="display: flex; flex-direction: column; gap: var(--space-2);">
            <h2 class="heading-card" style="margin: 0;">Account details</h2>
            <div class="two-col-grid" style="gap: var(--space-2); font-size: var(--step-0);">
              <div>
                <div class="font-mono-meta" style="color: var(--text-muted);">EMAIL ADDRESS</div>
                <div style="font-weight: 500; margin-top: 0.2rem;">${escapeHtml(state.user.email)}</div>
              </div>
              <div>
                <div class="font-mono-meta" style="color: var(--text-muted);">AUTHENTICATION PROVIDER</div>
                <div style="font-weight: 500; margin-top: 0.2rem;">
                  ${state.user.providerId === 'google.com' ? 'Google Sign-In (OAuth 2.0)' : 'Email & Password'}
                </div>
              </div>
              <div>
                <div class="font-mono-meta" style="color: var(--text-muted);">EMAIL VERIFICATION</div>
                <div style="font-weight: 500; margin-top: 0.2rem;">Verified owner</div>
              </div>
              <div>
                <div class="font-mono-meta" style="color: var(--text-muted);">SAVED OBSERVATIONS</div>
                <div style="font-weight: 500; margin-top: 0.2rem;">${entries.length} entries</div>
              </div>
            </div>
          </section>

          <section class="paper-surface" style="display: flex; flex-direction: column; gap: var(--space-2);">
            <h2 class="heading-card" style="margin: 0;">Data ownership &amp; export</h2>
            <p style="color: var(--text-muted); font-size: var(--step-0); margin: 0;">
              Your observations are scoped strictly to your authenticated UID under <code>users/{uid}/entries</code>. Client-side code has read-only access, and all mutations pass through validated serverless functions.
            </p>
            <div style="display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap;">
              <button type="button" class="btn btn-secondary" id="settings-export-btn">Download journal JSON export</button>
              <a href="#/privacy" style="font-size: var(--step--1); color: var(--text);">Read full Privacy Policy</a>
            </div>
          </section>

          <section class="paper-surface" style="border-color: var(--danger); display: flex; flex-direction: column; gap: var(--space-2);">
            <h2 class="heading-card" style="color: var(--danger); margin: 0;">Permanent account deletion</h2>
            <p style="color: var(--text-muted); font-size: var(--step-0); margin: 0;">
              Deleting your account invokes our authenticated serverless deletion workflow (<code>DELETE /api/account</code>), which removes your stored Firestore journal entries in batched transactions and deletes your Firebase Authentication record.
            </p>
            <div>
              <button type="button" class="btn btn-danger" id="settings-delete-account-btn">Delete account and all entries</button>
            </div>
          </section>
        </div>
      `;

      document.getElementById('settings-export-btn').addEventListener('click', () => {
        const payload = JSON.stringify({
          application: 'Small Wonders Field Journal',
          exportedAt: new Date().toISOString(),
          ownerEmail: state.user.email,
          entryCount: entries.length,
          entries
        }, null, 2);

        try {
          const blob = new Blob([payload], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'small-wonders-journal.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {}
        showToast('Downloaded JSON export of your journal.', 'success');
      });

      document.getElementById('settings-delete-account-btn').addEventListener('click', () => {
        openModal({
          title: 'Permanently delete your journal?',
          description: 'Type DELETE MY JOURNAL below to confirm permanent removal of your account and all observations.',
          bodyHtml: `
            <div class="field-group">
              <label class="field-label" for="confirm-delete-phrase-input">Confirmation phrase</label>
              <input id="confirm-delete-phrase-input" type="text" class="field-input" placeholder="DELETE MY JOURNAL" />
              <span id="confirm-delete-error" class="field-error" style="display: none;">Please type DELETE MY JOURNAL exactly.</span>
            </div>
          `,
          cancelLabel: 'Cancel',
          confirmLabel: 'Confirm permanent deletion',
          danger: true,
          onConfirm: () => {
            const val = document.getElementById('confirm-delete-phrase-input').value.trim();
            if (val !== 'DELETE MY JOURNAL') {
              document.getElementById('confirm-delete-error').style.display = 'block';
              return false;
            }
            safeStorageSet('sw_user_entries_v1_' + state.user.uid, null);
            safeStorageSet('sw_local_sandbox_auth_user_v1', null);
            state.user = null;
            showToast('Your account and journal entries have been permanently deleted.');
            navigate('/');
            return true;
          }
        });
      });
    }

    // =========================================================================
    // MAIN ROUTER DISPATCH
    // =========================================================================
    function renderApp() {
      renderHeader();
      renderFooter();
      const main = document.getElementById('main-view');
      if (!main) return;

      const r = state.route.split('?')[0];

      if (r.startsWith('/app') && !state.user) {
        navigate('/sign-in');
        return;
      }

      if (r === '/' || r === '') {
        renderLandingView(main);
      } else if (r === '/about') {
        renderLegalView(main, 'about');
      } else if (r === '/terms') {
        renderLegalView(main, 'terms');
      } else if (r === '/privacy') {
        renderLegalView(main, 'privacy');
      } else if (r === '/cookies') {
        renderLegalView(main, 'cookies');
      } else if (r === '/accessibility') {
        renderLegalView(main, 'accessibility');
      } else if (r === '/sign-in') {
        renderAuthView(main, 'signin');
      } else if (r === '/sign-up') {
        renderAuthView(main, 'signup');
      } else if (r === '/forgot-password') {
        renderAuthView(main, 'forgot');
      } else if (r === '/app') {
        renderDashboardView(main);
      } else if (r === '/app/journal') {
        renderArchiveView(main);
      } else if (r === '/app/new') {
        renderEditorView(main, null);
      } else if (r === '/app/settings') {
        renderSettingsView(main);
      } else if (r.startsWith('/app/journal/')) {
        const rest = r.slice('/app/journal/'.length);
        if (rest.endsWith('/edit')) {
          const id = decodeURIComponent(rest.slice(0, -5));
          renderDetailView(main, id, true);
        } else {
          const id = decodeURIComponent(rest);
          renderDetailView(main, id, false);
        }
      } else {
        destroyActiveThreeScene();
        main.innerHTML = `
          <div class="editorial-container section-band" style="padding-top: 7.5rem;" style="text-align: center; max-width: 560px;">
            <div class="glass" style="padding: var(--space-5) var(--space-4);">
              <p class="font-mono-meta" style="color: var(--accent);">404 / PAGE NOT FOUND</p>
              <h1 class="heading-section" style="margin-bottom: var(--space-2);">This page has wandered off the path.</h1>
              <p style="color: var(--text-muted); margin-bottom: var(--space-3);">The route you requested does not exist in Small Wonders.</p>
              <a href="#/" class="btn btn-primary">Return home</a>
            </div>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
